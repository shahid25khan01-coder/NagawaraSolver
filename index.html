    <script>
      // Filter benign Vite WebSocket dev-server disconnect notices in preview iframe
      window.addEventListener('error', function(event) {
        if (event && (event.message?.includes('WebSocket') || event.error?.message?.includes('WebSocket'))) {
          event.stopImmediatePropagation?.();
          event.preventDefault?.();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && (event.reason?.message?.includes('WebSocket') || String(event.reason).includes('WebSocket'))) {
          event.stopImmediatePropagation?.();
          event.preventDefault?.();
        }
      }, true);
    </script>
